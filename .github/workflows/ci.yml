name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -o fyke ./cmd/fyke

  frontend-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - run: git diff --exit-code -- internal/web/dist
      - run: bash -n deploy.sh install-docker.sh
      - run: docker compose config --quiet
